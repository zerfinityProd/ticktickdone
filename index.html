<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
  <meta name="description"
    content="TickTickDone — The interactive buyer inspection app. Scrutinize product quality, foam density, car PDI, gold HUID, and generate bill clauses before buying in India.">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="TickTickDone — Quality Inspector & Purchase Checklists">
  <meta property="og:description"
    content="Inspect quality and ensure salesmen don't mislead you. Checklists for sofas, cars, gold, laptops, and home interiors.">
  <meta property="og:image" content="assets/favicon.png">

  <title>TickTickDone — Smart Purchase Inspector</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">

  <!-- Fonts: Plus Jakarta Sans (Headings) + Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Scripts -->
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>

<body>
  <div id="app" class="app-root">
    <!-- Top App Bar -->
    <header class="app-header">
      <div class="header-container">
        <div class="header-brand-nav">
          <a href="#/" class="app-brand-link" aria-label="TickTickDone Home">
            <img src="assets/logo.png" alt="TickTickDone Logo" class="brand-logo" width="140" height="46">
          </a>
          <span class="app-badge-pill" id="app-active-indicator" title="Active Checklists">
            <span class="live-dot"></span>
            <span id="active-checks-count">0 Active Checks</span>
          </span>
        </div>

        <!-- Quick Search Bar / Trigger -->
        <div class="search-container">
          <div class="search-input-wrapper" id="search-trigger">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <input type="search" id="search-input" class="search-input" placeholder="Search sofa, car PDI, gold..."
              autocomplete="off" aria-label="Search purchase checklists">
            <kbd class="search-kbd" aria-hidden="true">/</kbd>
          </div>
          <div id="search-results" class="search-results" role="listbox" hidden></div>
        </div>
      </div>
    </header>

    <!-- Main Dynamic App Canvas -->
    <main id="main-content" class="main-canvas" tabindex="-1">
      <!-- Views rendered reactively by JS -->
    </main>

    <!-- Modern App Bottom Navigation Bar (Mobile / Tablet / Quick Dock) -->
    <nav class="bottom-nav-bar" aria-label="Primary Mobile Navigation">
      <div class="bottom-nav-inner">
        <a href="#/" class="nav-tab active" data-tab="home" id="tab-home" aria-label="Home Discover">
          <span class="tab-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </span>
          <span class="tab-label">Discover</span>
        </a>

        <a href="#/categories" class="nav-tab" data-tab="categories" id="tab-categories" aria-label="Browse Categories">
          <span class="tab-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="7" height="7" x="3" y="3" rx="1"></rect>
              <rect width="7" height="7" x="14" y="3" rx="1"></rect>
              <rect width="7" height="7" x="14" y="14" rx="1"></rect>
              <rect width="7" height="7" x="3" y="14" rx="1"></rect>
            </svg>
          </span>
          <span class="tab-label">Categories</span>
        </a>

        <a href="#/active" class="nav-tab" data-tab="active" id="tab-active" aria-label="My Active Checklists">
          <span class="tab-icon tab-icon-badge-wrap">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            <span class="tab-badge" id="nav-active-badge" hidden>0</span>
          </span>
          <span class="tab-label">My Checks</span>
        </a>

        <a href="#/bill-shield" class="nav-tab" data-tab="shield" id="tab-shield" aria-label="Salesperson & Bill Protection Shield">
          <span class="tab-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
          </span>
          <span class="tab-label">Bill Shield</span>
        </a>
      </div>
    </nav>

    <!-- App Footer for wide screens -->
    <footer class="app-footer">
      <div class="footer-container">
        <p class="footer-tagline"><strong>TickTickDone</strong> — India's Pre-Purchase Quality Inspector</p>
        <p class="footer-copyright">&copy; 2026 TickTickDone. Curated by consumer quality experts.</p>
      </div>
    </footer>
  </div>

  <!-- Global Modal: Bill Protection Clauses -->
  <div id="bill-shield-modal" class="app-modal" role="dialog" aria-modal="true" aria-labelledby="bill-modal-title" hidden>
    <div class="modal-backdrop" id="bill-modal-backdrop"></div>
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <span class="modal-icon-badge">🛡️</span>
          <div>
            <h3 id="bill-modal-title" class="modal-title">Bill Protection Clause</h3>
            <p class="modal-subtitle">Insist the salesperson writes this on your invoice before paying</p>
          </div>
        </div>
        <button type="button" class="modal-close-btn" id="btn-close-bill-modal" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body" id="bill-modal-body">
        <!-- Injected dynamically -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="btn-copy-bill-clauses">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
          Copy Clauses
        </button>
        <a href="#" class="btn btn-primary" id="btn-whatsapp-bill-clauses" target="_blank" rel="noopener">
          <span>WhatsApp to Salesperson</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Celebration Confetti Container -->
  <div id="confetti-container" aria-hidden="true"></div>

  <!-- Interactive Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>

</html>
