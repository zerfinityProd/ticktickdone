<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tick Tick Done — Smart Purchase Checklists. Make confident, well-informed buying decisions with interactive checklists.">
  <meta name="theme-color" content="#1B5E20">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ticktickdone.com/">
  <meta property="og:title" content="Tick Tick Done — Smart Purchase Checklists">
  <meta property="og:description" content="Smart interactive purchase checklists to help you evaluate and buy anything with confidence.">
  <meta property="og:image" content="assets/favicon.svg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Tick Tick Done — Smart Purchase Checklists">
  <meta property="twitter:description" content="Smart interactive purchase checklists to help you evaluate and buy anything with confidence.">
  <meta property="twitter:image" content="assets/favicon.svg">

  <title>Tick Tick Done — Smart Purchase Checklists</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Scripts -->
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-container">
        <div class="header-brand-nav">
          <a href="#/" class="app-logo" aria-label="Tick Tick Done Home">
            <span class="logo-mark" aria-hidden="true"></span>
            <span class="logo-text">TickTickDone</span>
          </a>
          <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb navigation"></nav>
        </div>
        <div class="search-container">
          <div class="search-input-wrapper">
            <span class="search-icon" aria-hidden="true"></span>
            <input 
              type="search" 
              id="search-input" 
              class="search-input" 
              placeholder="Search checklists..." 
              autocomplete="off" 
              aria-label="Search purchase checklists"
              aria-expanded="false"
              aria-controls="search-results"
            >
          </div>
          <div id="search-results" class="search-results" role="listbox" hidden></div>
        </div>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      <!-- Views rendered here by JS -->
    </main>

    <footer class="app-footer">
      <div class="footer-container">
        <p class="footer-tagline">Smart Purchase Checklists for Confident Decisions</p>
        <p class="footer-copyright">&copy; 2026 TickTickDone. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <!-- Confetti Container -->
  <div id="confetti-container" aria-hidden="true"></div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
